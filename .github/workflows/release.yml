name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build artifact
        run: zip -r task-tracker-${{ github.ref_name }}.zip app.py requirements.txt README.md CHANGELOG.md
      - uses: softprops/action-gh-release@v2
        with:
          files: task-tracker-${{ github.ref_name }}.zip
          generate_release_notes: true
